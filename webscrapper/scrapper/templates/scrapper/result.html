<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <title>Scrapper Result</title>
        
    </head>
<body>
    <div class="container">
        <div class ="row m-5">
            <div class="col-md-12">
                <h1>Link Collector</h1>
            </div>
        <div class="row m-5 ml-5 align-items-center">
            <div class="col-md-12">
                <form method="POST" action="/" class="d-flex justify-content-between align-items-center">
                    {% csrf_token %}
                    <input class="form-control form-control-lg mr-3" type="text" id="site" name="site" placeholder="Enter URL" style="flex: 1 1 auto; max-width: 60%;">
                    <button type="submit" class="btn btn-primary btn-lg mx-3">Submit</button>
                    <a class="btn btn-warning btn-lg" href="/delete" role="button">Delete</a>
                </form>
            </div>
        </div>
        <div class="row">
            <div class="col-md-8">
                <table class="table">
                    <thead>
                      <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Name</th>
                        <th scope="col">Link</th>
                      </tr>
                    </thead>
                    <tbody>
                    {% for link in data %}
                      <tr>
                        <td>{{link.id}}</td>
                        <td>{{link.name}}</td>
                        <td>{{link.address}}</td>
                      </tr>
                    {% endfor %}
                    </tbody>
                  </table>
            </div>    
        </div>    
    </div>
        
    
</body>
</html>
